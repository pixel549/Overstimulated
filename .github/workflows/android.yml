name: Build Android APK

# Builds the mobile rebuild in /mobile into a debug APK (sideloadable, no signing needed).
# Run it from the Actions tab ("Run workflow") or push a change under mobile/.
# The APK is attached to the run as an artifact AND published as a GitHub release, so you can
# download it straight from your phone's browser: Releases -> latest "mobile-N" -> overstimulated-debug.apk

on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          # landscape, fullscreen-ish
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$M"
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overstimulated-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: overstimulated-debug-apk
          path: mobile/overstimulated-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: Mobile build ${{ github.run_number }}
          prerelease: true
          files: mobile/overstimulated-debug.apk
